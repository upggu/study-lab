# kagent-lab 8장 — backend ServiceAccount의 최소 권한. kagent namespace의 Agent만 관리한다.
# Secret·ModelConfig·RemoteMCPServer·SandboxAgent와 cluster-scoped resource는 허용하지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-backend
  namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-backend
  namespace: kagent
rules:
  - apiGroups: ["kagent.dev"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-backend
  namespace: kagent
subjects:
  - kind: ServiceAccount
    name: agent-backend
    namespace: kagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-backend
