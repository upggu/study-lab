# study realm — 단계 app-a  (diff realm/study/base.yaml realm/study/app-a.yaml 로 증분을 본다)
#
# 추가: 앱 A를 위한 confidential client 하나. 앱 A의 서버 코드(app/server.mjs)가 보내는
# authorization request와 이 등록이 정확히 맞아야 로그인이 된다.
#   - Authorization Code flow만 켠다 (standardFlowEnabled). implicit·password grant·service account는 끈다.
#   - callback은 정확히 하나. wildcard를 쓰지 않는다.
#   - PKCE S256을 요구한다. 앱은 code_challenge 없이 로그인할 수 없다.
#   - client secret은 secret 파일에서 치환한다. 같은 파일을 앱 A container도 읽는다.

realm: study
displayName: Keycloak Study Lab
enabled: true
sslRequired: external
registrationAllowed: false
resetPasswordAllowed: false
rememberMe: false

users:
  - username: local-user
    enabled: true
    firstName: Local
    lastName: User
    email: local-user@keycloak.test
    emailVerified: true
    credentials:
      - type: password
        value: "$(file:UTF-8:/run/secrets/local-user-password)"
        temporary: false

clients:
  - clientId: app-a
    name: app-a (Keycloak Lab App A)
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "$(file:UTF-8:/run/secrets/app-a-client-secret)"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - https://app-a.keycloak.test:30081/callback
    webOrigins:
      - https://app-a.keycloak.test:30081
    attributes:
      pkce.code.challenge.method: S256
