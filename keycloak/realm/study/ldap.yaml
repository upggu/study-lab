# study realm — 단계 ldap  (diff realm/study/api.yaml realm/study/ldap.yaml)
#
# 추가: components 아래 User Federation provider 하나. Keycloak이 Samba AD 호환 디렉터리를
# LDAPS로 읽고, 로그인 때 그 디렉터리에 bind해 비밀번호를 확인한다.
#   - 상대 부서(디렉터리 팀)가 준 값: connectionUrl, usersDn, bindDn, bind 비밀번호, 그 디렉터리의 CA.
#     이 lab에서는 Compose의 Samba container가 그 역할이고 CA는 Keycloak truststore에 mount돼 있다.
#   - editMode READ_ONLY: Keycloak은 디렉터리를 쓰지 않는다. importEnabled true: 사용자 표현을
#     Keycloak DB에 만들되 비밀번호 원본은 디렉터리에 남는다.
#   - 주기 sync는 끈다(-1). 동기화는 설정이 아니라 동작이므로 ./lab.sh sync 로 따로 실행한다.
# 이 단계에는 group mapper가 없다. alice·bob은 로그인되지만 role이 없어 /api/user는 403이다.

realm: study
displayName: Keycloak Study Lab
enabled: true
sslRequired: external
registrationAllowed: false
resetPasswordAllowed: false
rememberMe: false

roles:
  realm:
    - name: app-user
      description: 앱과 API의 일반 기능 (/api/user)
    - name: api-admin
      description: API 관리 기능 (/api/admin)

users:
  - username: local-user
    enabled: true
    firstName: Local
    lastName: User
    email: local-user@keycloak.test
    emailVerified: true
    realmRoles:
      - default-roles-study
      - app-user
    credentials:
      - type: password
        value: "$(file:UTF-8:/run/secrets/local-user-password)"
        temporary: false

clients:
  - clientId: app-a
    name: app-a (Keycloak Lab App A)
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "$(file:UTF-8:/run/secrets/app-a-client-secret)"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - https://app-a.keycloak.test:30081/callback
    webOrigins:
      - https://app-a.keycloak.test:30081
    attributes:
      pkce.code.challenge.method: S256
    protocolMappers:
      - name: lab-api-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: lab-api
          access.token.claim: "true"
          id.token.claim: "false"
          introspection.token.claim: "true"

  - clientId: app-b
    name: app-b (Keycloak Lab App B)
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "$(file:UTF-8:/run/secrets/app-b-client-secret)"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - https://app-b.keycloak.test:30082/callback
    webOrigins:
      - https://app-b.keycloak.test:30082
    attributes:
      pkce.code.challenge.method: S256
    protocolMappers:
      - name: lab-api-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: lab-api
          access.token.claim: "true"
          id.token.claim: "false"
          introspection.token.claim: "true"

  - clientId: lab-api
    name: lab-api (Keycloak Lab API)
    enabled: true
    protocol: openid-connect
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false

components:
  org.keycloak.storage.UserStorageProvider:
    - name: samba-ad
      providerId: ldap
      subComponents:
        org.keycloak.storage.ldap.mappers.LDAPStorageMapper:
          # Keycloak은 LDAP provider를 만들 때 속성 mapper를 자동 생성하지만, config-cli는 파일에 없는
          # subComponent를 지운다. 그래서 필요한 mapper를 여기 명시한다. 디렉터리 속성 → Keycloak 사용자 필드.
          - name: username
            providerId: user-attribute-ldap-mapper
            config:
              ldap.attribute: ["sAMAccountName"]
              user.model.attribute: ["username"]
              read.only: ["true"]
              always.read.value.from.ldap: ["false"]
              is.mandatory.in.ldap: ["true"]
          - name: first name
            providerId: user-attribute-ldap-mapper
            config:
              ldap.attribute: ["givenName"]
              user.model.attribute: ["firstName"]
              read.only: ["true"]
              always.read.value.from.ldap: ["true"]
              is.mandatory.in.ldap: ["false"]
          - name: last name
            providerId: user-attribute-ldap-mapper
            config:
              ldap.attribute: ["sn"]
              user.model.attribute: ["lastName"]
              read.only: ["true"]
              always.read.value.from.ldap: ["true"]
              is.mandatory.in.ldap: ["false"]
          - name: email
            providerId: user-attribute-ldap-mapper
            config:
              ldap.attribute: ["mail"]
              user.model.attribute: ["email"]
              read.only: ["true"]
              always.read.value.from.ldap: ["false"]
              is.mandatory.in.ldap: ["false"]
          - name: MSAD account controls
            # AD의 userAccountControl(계정 비활성·만료)을 Keycloak의 enabled 상태로 읽는다.
            providerId: msad-user-account-control-mapper
            config:
              ldap.password.policy.hints.enabled: ["false"]
      config:
        enabled: ["true"]
        priority: ["0"]
        vendor: ["ad"]
        connectionUrl: ["ldaps://dc1.ad.keycloak.test:636"]
        useTruststoreSpi: ["always"]
        startTls: ["false"]
        authType: ["simple"]
        bindDn: ["Administrator@AD.KEYCLOAK.TEST"]
        bindCredential: ["$(file:UTF-8:/run/secrets/samba-admin-password)"]
        usersDn: ["CN=Users,DC=ad,DC=keycloak,DC=test"]
        searchScope: ["1"]
        userObjectClasses: ["person, organizationalPerson, user"]
        usernameLDAPAttribute: ["sAMAccountName"]
        rdnLDAPAttribute: ["cn"]
        uuidLDAPAttribute: ["objectGUID"]
        editMode: ["READ_ONLY"]
        importEnabled: ["true"]
        syncRegistrations: ["false"]
        fullSyncPeriod: ["-1"]
        changedSyncPeriod: ["-1"]
        batchSizeForSync: ["1000"]
        cachePolicy: ["DEFAULT"]
        pagination: ["true"]
        connectionPooling: ["true"]
        trustEmail: ["false"]
        validatePasswordPolicy: ["false"]
        allowKerberosAuthentication: ["false"]
        useKerberosForPasswordAuthentication: ["false"]
