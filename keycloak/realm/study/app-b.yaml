# study realm — 단계 app-b  (diff realm/study/app-a.yaml realm/study/app-b.yaml)
#
# 추가: 앱 B의 client. 앱 A와 같은 realm에 있으므로 Keycloak SSO session을 공유하지만,
# client ID·secret·callback은 서로 다르다. 두 앱이 cookie를 나눠 쓰는 것이 아니라
# 브라우저가 Keycloak에 가진 session 하나를 두 client가 다시 쓰는 것이다.

realm: study
displayName: Keycloak Study Lab
enabled: true
sslRequired: external
registrationAllowed: false
resetPasswordAllowed: false
rememberMe: false

users:
  - username: local-user
    enabled: true
    firstName: Local
    lastName: User
    email: local-user@keycloak.test
    emailVerified: true
    credentials:
      - type: password
        value: "$(file:UTF-8:/run/secrets/local-user-password)"
        temporary: false

clients:
  - clientId: app-a
    name: app-a (Keycloak Lab App A)
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "$(file:UTF-8:/run/secrets/app-a-client-secret)"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - https://app-a.keycloak.test:30081/callback
    webOrigins:
      - https://app-a.keycloak.test:30081
    attributes:
      pkce.code.challenge.method: S256

  - clientId: app-b
    name: app-b (Keycloak Lab App B)
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "$(file:UTF-8:/run/secrets/app-b-client-secret)"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - https://app-b.keycloak.test:30082/callback
    webOrigins:
      - https://app-b.keycloak.test:30082
    attributes:
      pkce.code.challenge.method: S256
